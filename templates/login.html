<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ 'Login' if is_login else 'Register' }} - HARVESTER_OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-panel panel-border rounded-xl p-8 shadow-[0_0_30px_rgba(0,0,0,0.5)] w-full max-w-md">

        <div class="flex items-center justify-center gap-4 mb-8">
            <div class="h-12 w-12 bg-neon rounded-full flex items-center justify-center shadow-[0_0_15px_#00F0FF]">
                <svg class="w-8 h-8 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold tracking-wider">HARVESTER<span class="text-neon">_OS</span></h1>
                <p class="text-sm text-slate-400 font-mono text-center mt-1">SECURE ACCESS</p>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div
            class="mb-6 p-3 rounded font-mono text-sm {% if category == 'error' %}bg-red-500/20 text-red-400 border border-red-500/50{% else %}bg-green-500/20 text-green-400 border border-green-500/50{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') if is_login else url_for('register') }}"
            class="flex flex-col gap-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
                    for="username">Operator ID</label>
                <input
                    class="w-full bg-dark border border-slate-600 text-white font-mono px-4 py-3 rounded focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all"
                    id="username" name="username" type="text" maxlength="64" autocomplete="username" required placeholder="Enter username">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
                    for="password">Passcode</label>
                <input
                    class="w-full bg-dark border border-slate-600 text-white font-mono px-4 py-3 rounded focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all"
                    id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required placeholder="Enter password">
            </div>

            <button type="submit"
                class="w-full bg-neon text-dark font-bold font-mono tracking-wider py-3 rounded mt-4 hover:bg-white transition-colors duration-300 shadow-[0_0_10px_rgba(0,240,255,0.3)]">
                {{ 'AUTHENTICATE' if is_login else 'REGISTER OPERATOR' }}
            </button>
        </form>

        <p class="mt-8 text-center text-slate-500 text-sm font-mono">Need an account? Ask the dashboard administrator.</p>

    </div>

</body>

</html>
